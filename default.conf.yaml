- defaults:
    link:
      relink: true
      create: true
      force: true

- clean: ['~']

- link:
    ~/.zshrc: zsh/zshrc
    ~/.zinit: zsh/zinit
    ~/.p10k.zsh: zsh/p10k.zsh
    ~/.tmux.conf: tmux/tmux.conf
    ~/.tmux.conf.local: tmux/tmux.conf.local
    ~/.vim: vim
    ~/.vimrc: vim/vimrc
    ~/.tmux/plugins: 
      path: tmux/plugins
      create: true
    ~/.config/neofetch/config.conf:
      path: neofetch/config.conf
      create: true
      force: true

- create:
    - ~/downloads
    - ~/.tmux
    - ~/.vim/undo-history

- brew:
    - neofetch
    - fasd
    - bat

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  - command: ./git/set-gitconfig.sh
    description: Configuring Git
    stdout: true
    quiet: false

  - command: ./zsh/set-shell.sh
    description: "Making zsh the default shell"
    stdin: true
    stderr: true
    stdout: true

