- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    ~/.zshrc: zsh/zshrc
    ~/.zplugin: zsh/zplugin
    ~/.p10k.zsh: zsh/p10k.zsh
    
    # VS Code MacOS
    ~/Library/Application Support/Code/User:
      if: '[ `uname` = Darwin ]'
      glob: true
      path: vscode/macos/*.json
      force: true

- link:
    ~/.config/neofetch/config.conf:
      path: neofetch/config.conf
      create: true
      force: true


- create:
    - ~/downloads
    - ~/.vim/undo-history

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  -
    command: ./git/set-gitconfig.sh
    description: Configuring Git
    stdout: true
    quiet: false

  - command: ./zsh/set-shell.sh
    description: "Making zsh the default shell"
    stdin: true
    stderr: true
    stdout: true

